# Observe an MCP server on every pull request, from the runner, and keep the JSON file as an artifact.
# Pin the Action to a release tag or a full commit SHA once the repository publishes them.
name: Release Check
on: pull_request
permissions:
  contents: read
  pull-requests: write # only for the pull request comment; without it the comment is skipped with a warning
jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - id: check
        uses: mcpcheckup/release-check@main
        with:
          url: https://staging.example.com/mcp
      - uses: actions/upload-artifact@v4
        with:
          name: release-check-observation
          path: ${{ steps.check.outputs.observation-file }}
